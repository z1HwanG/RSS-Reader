[package]
name = "rss-reader"
version = "0.6.0"
description = "RSS 桌面阅读器"
authors = ["RSS Reader"]
edition = "2021"

[lib]
name = "rss_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# stream 特性用于翻译的流式读取（SSE）：边生成边把译文推给前端，不用等整段生成完
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "system-proxy", "gzip", "brotli", "deflate", "socks", "stream"] }
# 消费 reqwest 的 bytes_stream（翻译流式读取）；reqwest 本来就传递依赖它，这里只是显式声明
futures-util = { version = "0.3", default-features = false, features = ["std"] }
feed-rs = "2"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
url = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
# 腾讯云按 QPS 限流，请求之间要限速（用 tokio 的定时器）；tauri 本来就依赖它，这里只是显式声明
tokio = { version = "1", features = ["time"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
